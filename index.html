<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I HAVE A GIFT FOR YOU!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #1a001a 0%, #330033 50%, #000 100%);
}

/* ===== TEXT ===== */
.led-scroller {
  position: absolute;
  z-index: 3;
  white-space: nowrap;
  font-family: 'Pacifico', cursive;
  color: #ff69b4;
  text-shadow: 0 0 8px #ff69b4, 0 0 20px #ff69b4;
  opacity: 0;
  transition: opacity 2.5s ease;
}

@media (max-width: 600px) { .led-scroller { font-size: 16px; } }
@media (min-width: 601px) { .led-scroller { font-size: 22px; } }

/* ===== STARS ===== */
.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 1;
}

.star {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  opacity: 0;
}

/* ===== BUTTON ===== */
#clickBtn {
  position: absolute;
  z-index: 4;
  font-size: 0.9rem; /* slightly smaller */
  font-family: 'Pacifico', cursive;
  background: transparent;
  color: #ff69b4;
  text-shadow: 0 0 6px #ff69b4, 0 0 12px #ff1493, 0 0 18px #ffb6c1;
  border: none;
  cursor: pointer;
  opacity: 0;
  transform: translate(-50%, -50%);
  transition: all 0.3s ease;
}
#clickBtn:hover {
  transform: translate(-50%, -50%) scale(1.2);
  text-shadow: 0 0 10px #ff69b4, 0 0 18px #ff1493, 0 0 25px #ffb6c1;
}
</style>
</head>

<body>

<div class="led-scroller" id="ledText"></div>
<div class="stars"></div>
<button id="clickBtn">Click Me!</button>

<script>
// ===== STARS SETUP =====
const starsContainer = document.querySelector('.stars');
const starCount = 160;
const stars = [];

// pink shades for heart
const pinkShades = ['#ff69b4', '#ff1493', '#ffb6c1', '#ff85c1', '#ff4da6'];

for (let i = 0; i < starCount; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  starsContainer.appendChild(star);

  const color = pinkShades[Math.floor(Math.random() * pinkShades.length)];
  star.style.background = color;
  star.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}, 0 0 18px ${color}`;

  stars.push({
    el: star,
    x: innerWidth / 2,
    y: innerHeight / 2,
    t: (i / starCount) * Math.PI * 2,
    speed: 0.05
  });
}

// ===== HEART PATH =====
function heartPath(t, scale) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3) * scale,
    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t)) * scale
  };
}

let formHeart = false;
let pulse = 0;

// ===== ANIMATION =====
function animateStars() {
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const baseScale = innerWidth < 600 ? 8 : 18;
  const pulseScale = formHeart ? baseScale + Math.sin(pulse) * 0.6 : baseScale;

  stars.forEach((s, i) => {
    if (formHeart) {
      const target = heartPath(s.t, pulseScale);
      s.x += (cx + target.x - s.x) * s.speed;
      s.y += (cy + target.y - s.y) * s.speed;

      // flowing leader motion
      s.t += 0.01 + i * 0.0001;
      s.el.style.opacity = 1;
    }
    s.el.style.transform = `translate(${s.x}px, ${s.y}px)`;
  });

  if (formHeart) pulse += 0.02;
  requestAnimationFrame(animateStars);
}
animateStars();

// ===== TEXT SEQUENCE =====
const ledText = document.getElementById('ledText');
ledText.style.left = '50%';
ledText.style.top = '50%';
ledText.style.transform = 'translate(-50%, -50%)';

// 1️⃣ HIII BABYYY
setTimeout(() => {
  ledText.textContent = 'HIII BABYYY';
  ledText.style.opacity = 1;
}, 1200);

setTimeout(() => { ledText.style.opacity = 0; }, 4200);

// 2️⃣ I MISS YOU SO MUCH!
setTimeout(() => {
  ledText.textContent = 'I MISS YOU SO MUCH!';
  ledText.style.opacity = 1;
}, 5600);

setTimeout(() => { ledText.style.opacity = 0; }, 9000);

// 3️⃣ I HAVE A GIFT FOR YOU!
setTimeout(() => {
  ledText.textContent = 'I HAVE A GIFT FOR YOU!';
  ledText.style.opacity = 1;
}, 10400);

setTimeout(() => { ledText.style.opacity = 0; }, 14500);

// ===== FORM HEART =====
setTimeout(() => { formHeart = true; }, 16000);

// ===== SHOW BUTTON =====
setTimeout(() => {
  const btn = document.getElementById('clickBtn');
  btn.style.left = innerWidth / 2 + 'px';
  btn.style.top = innerHeight / 2 + 'px';
  btn.style.opacity = 1;
}, 19500);

// ===== BUTTON CLICK =====
document.getElementById('clickBtn').onclick = () => {
  window.open('https://xoxocinx.github.io/SUPRISE/', '_blank');
};
</script>

</body>
</html>
