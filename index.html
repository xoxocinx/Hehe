<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I HAVE A GIFT FOR YOU!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  background: radial-gradient(circle at center, #1a001a 0%, #330033 50%, #000000 100%);
  display: flex; justify-content: center; align-items: center;
  position: relative;
}
.led-scroller {
  display: flex; white-space: nowrap;
  position: absolute; z-index: 3;
  color: #ff69b4; font-size: 2.2vw;
  text-shadow: 0 0 5px #ff69b4, 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 40px #ff69b4;
  font-family: 'Pacifico', cursive;
  transition: left 2s ease, top 2s ease;
}
.heart-center { animation: pulse 2s infinite alternate; }
@keyframes pulse {
  0% { text-shadow:0 0 5px #ff69b4,0 0 10px #ff69b4,0 0 20px #ff69b4,0 0 40px #ff69b4; }
  100% { text-shadow:0 0 15px #ff69b4,0 0 25px #ffb6c1,0 0 35px #ff1493,0 0 50px #ff69b4; }
}
.led-scroller span { margin: 0 0.2em; animation: flicker 1.5s infinite, colorCycle 3s infinite alternate; }
@keyframes flicker { 0%,19%,21%,23%,25%,54%,56%,100% { opacity:1; } 20%,22%,24%,55%{opacity:0.3;} }
@keyframes colorCycle { 0%{color:#ff69b4;}33%{color:#ffb6c1;}66%{color:#ff1493;}100%{color:#ff69b4;} }
.stars { position:absolute;width:100%;height:100%;z-index:1; filter:drop-shadow(0 0 10px #ff69b4) drop-shadow(0 0 20px #ffb6c1); will-change: transform;}
.star { position:absolute;width:4px;height:4px;background:#ff69b4;border-radius:50%;opacity:0.8;box-shadow:0 0 5px #ff69b4,0 0 10px #ff69b4,0 0 15px #ff69b4; will-change: transform;}
#clickBtn { 
  position:absolute; z-index:4; padding:4px 10px; font-size:0.7rem; font-family:'Pacifico', cursive;
  background:#ff69b4; color:white; border:none; border-radius:8px; 
  box-shadow:0 0 8px #ff69b4,0 0 15px #ffb6c1; cursor:pointer; opacity:0; 
  transition: opacity 3s, transform 1s; /* slower fade-in */
}
</style>
</head>
<body>

<div class="led-scroller" id="ledText">
  <span>I</span><span> </span>
  <span>H</span><span>A</span><span>V</span><span>E</span><span> </span>
  <span>A</span><span> </span>
  <span>G</span><span>I</span><span>F</span><span>T</span><span> </span>
  <span>F</span><span>O</span><span>R</span><span> </span>
  <span>Y</span><span>O</span><span>U</span><span>!</span>
</div>

<div class="stars"></div>
<button id="clickBtn">Click Me</button>

<script>
// ========== Stars Setup ==========
const starsContainer = document.querySelector('.stars');
const starCount = 150;
let stars = [];
for(let i=0;i<starCount;i++){
  const star = document.createElement('div');
  star.classList.add('star');
  starsContainer.appendChild(star);
  stars.push({
    element: star, 
    x: Math.random()*window.innerWidth, 
    y: Math.random()*window.innerHeight, 
    t: i/starCount*Math.PI*2, 
    speed: 0.05
  });
}

// ========== Heart Path ==========
function heartPath(t, scale){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return {x:x*scale, y:-y*scale};
}

// ========== Animate Stars ==========
let formHeart = false;
function animateStars(){
  const cx = window.innerWidth/2;
  const cy = window.innerHeight/2;
  const scale = window.innerWidth<600?9:30;

  stars.forEach((s,i)=>{
    if(formHeart){
      const target = heartPath(s.t, scale);
      s.x += (cx+target.x - s.x)*s.speed;
      s.y += (cy+target.y - s.y)*s.speed;
      s.t += 0.01 + i*0.0001;
    }
    s.element.style.transform = `translate(${s.x}px,${s.y}px)`;
  });
  requestAnimationFrame(animateStars);
}
animateStars();

// ========== Text Scroll ==========
const ledText = document.getElementById('ledText');
let posX = window.innerWidth;
function animateScroll(){
  posX -= 3;
  ledText.style.left = posX+'px';
  ledText.style.top = '50%';
  ledText.style.transform = 'translateY(-50%)';
  if(posX < window.innerWidth/2 - ledText.offsetWidth/2){ // Stop smoothly at center
    posX = window.innerWidth/2 - ledText.offsetWidth/2;
    moveTextToCenter();
    return;
  }
  requestAnimationFrame(animateScroll);
}
animateScroll();

// ========== Move Text Center ==========
function moveTextToCenter(){
  const textWidth = ledText.offsetWidth;
  const textHeight = ledText.offsetHeight;
  const centerX = window.innerWidth/2 - textWidth/2;
  const centerY = window.innerHeight/2 - textHeight/2;
  ledText.style.left = centerX+'px';
  ledText.style.top = centerY+'px';
  ledText.classList.add('heart-center');

  // Start forming heart and fade in button after 5s
  setTimeout(()=>{
    formHeart = true;
    const btn = document.getElementById('clickBtn');
    btn.style.left = centerX + textWidth/2 - btn.offsetWidth/2 + 'px';
    btn.style.top = centerY + textHeight + 10 + 'px';
    btn.style.opacity = 1; // slow fade-in
  }, 5000);
}

// ========== Responsive Font ==========
function updateFont(){
  const fontSize = Math.min(Math.max(window.innerWidth*0.025,10),20);
  ledText.style.fontSize = fontSize+'px';
}
updateFont();
window.addEventListener('resize', updateFont);

// ========== Click Me Button ==========
document.getElementById('clickBtn').addEventListener('click', ()=>{
  window.open('https://xoxocinx.github.io/SUPRISE/', '_blank');
});
</script>
</body>
</html>
